name: Đăng GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Làm mới trạng thái model / bảng giá / khuyến mãi. 5 phút là mức ngắn nhất GitHub cho phép,
  # và lúc đông GitHub thường chạy trễ hơn lịch.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tải dữ liệu công khai
        run: sh scripts/fetch-data.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
